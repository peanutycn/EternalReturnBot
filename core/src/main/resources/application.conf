lomu {
  server {
    # Ktor HTTP server binding
    host = "0.0.0.0"
    port = 8080
  }

  onebot {
    # Mode:
    # - auto: use simbot when apiServerHost is http(s)://..., otherwise use ws-only
    # - ws:   forward WebSocket only (no HTTP required)
    # - simbot: HTTP API + WS events (requires apiServerHost=http(s)://...)
    mode = "auto"

    # Optional. If empty, a random UUID will be generated each start.
    # botUniqueId = "123456789"

    # OneBot v11 implementation endpoints (e.g., NapCat/LLOneBot/Lagrange)
    # If you only have forward WebSocket (no HTTP API), keep apiServerHost empty.
    apiServerHost = ""
    eventServerHost = "ws://127.0.0.1:3001"

    # Optional. Some OneBot implementations require an access token.
    # accessToken = ""

    # Command acknowledgement (best-effort).
    # It reacts to the triggering message using `set_msg_emoji_like`.
    ackEmoji {
      enable = true
      # Default "OK" reaction id used by old repo.
      emojiId = "124"
    }
  }

  bser {
    # Eternal Return OpenAPI key
    # Prefer using a local file or environment variable in production.
    # openApiKey = "YOUR_OPEN_API_KEY"
    # openApiKeyFile = "config/open-api-key.txt"
  }

  playwright {
    # Use headless in server environments.
    headless = true
    poolSize = 1
  }

  render {
    # How many matches are rendered in the final screenshot.
    maxMatches = 20

    # How many recent ranked matches will include teammate details (extra DakGG requests).
    teammateMatches = 2
  }

  resources {
    # Concurrent downloads for required images/resources.
    downloadConcurrency = 16
  }

  alias {
    # Optional global managers (user ids) who can manage GLOBAL aliases.
    # superAdmins = ["123456789"]

    # Optional. Override alias store directory.
    # When empty, it defaults to `<jarDir>/data/aliases/`.
    # Structure:
    # - global.json
    # - users/<userId>.json        (personal, user-only)
    # - groups/<groupId>.json      (group shared)
    # storeDir = "/opt/erbot/data/aliases"

    # Role check switch (OneBot only).
    enableOneBotRoleCheck = true

    # If true, allow group owner/admin to manage GLOBAL aliases.
    allowGroupAdminGlobal = true
  }

  alert {
    # Global switch for forwarding alerts/feedback to superAdmins.
    enable = true

    # Rate-limit identical exceptions (by exception class + top stack frame).
    cooldownSeconds = 60

    # How many stack lines to include in the forwarded message.
    maxStackTraceLines = 12

    # Hard limit for forwarded message length (OneBot text message).
    maxMessageChars = 1800

    # Forward private messages sent to the bot to superAdmins (WS-only mode only).
    forwardPrivate {
      enable = false
    }

    # Forward group join/invite requests to superAdmins (WS-only mode only).
    forwardGroupInvite {
      enable = true
    }

    # Allow normal users to "apply" for GLOBAL alias changes, which will be forwarded to superAdmins.
    aliasRequest {
      enable = true
    }
  }

  broadcast {
    # Super-admin only. Enable private-chat triggered group broadcast (WS-only mode only).
    enable = false

    # Groups in this blacklist will not receive broadcasts.
    # groupBlacklist = ["123456789", "987654321"]

    # Two-step confirmation TTL for "群发" (seconds).
    confirmTtlSeconds = 60

    # Delay between sending messages to groups (ms).
    sendDelayMs = 150
  }

  http {
    proxy {
      # Example:
      # url = "http://127.0.0.1:7890"
      # url = "http://user:pass@127.0.0.1:7890"
      #
      # When empty, no proxy will be used.
      # url = ""
    }
  }
}
